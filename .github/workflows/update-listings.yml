name: Update listings and publish

on:
  schedule:
    - cron: "7 1,5,9,13,17,21 * * *"   # every 4 hours (UTC), a few minutes past the hour
  workflow_dispatch:                    # "Run workflow" button
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
    # data/** is NOT ignored: pushing a local scrape (see "Topping up from your Mac" in
    # the README) republishes the site. Such a push publishes the committed data as it
    # is — the scrape step below is skipped, because re-scraping here would throw away
    # the very thing the local run was for: sources that refuse this runner's IP.
    # The workflow's own commits use GITHUB_TOKEN, which GitHub deliberately does not
    # let trigger another run, so there is no loop.

permissions:
  contents: write      # commit the refreshed listings
  pages: write         # publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the scrape decision below diffs this push against its base

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A push that carries data/ is a scrape run from a real connection, which reads
      # sources this runner cannot (Property Cayman blocks datacenter IPs). Publish it
      # as committed. Everything else — the schedule, the Run workflow button — scrapes.
      - name: Decide whether to scrape
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          if [ "$EVENT" != "push" ]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$EVENT run — scraping the agency websites."
            exit 0
          fi
          # Diff the whole push, not just its last commit. A force-push or a first
          # push leaves BEFORE unusable, so fall back to the final commit alone.
          zero=0000000000000000000000000000000000000000
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          changed=$(git diff --name-only "$range" 2>/dev/null || true)
          echo "Changed in $range:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -q '^data/'; then
            echo "scrape=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This push carries listing data — publishing it as committed, not re-scraping."
          else
            echo "scrape=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Code-only push — scraping the agency websites."
          fi

      # A site that is down or slow keeps its last good listings (data/raw/), so the
      # scrape never leaves the site empty. The step itself must not fail the run.
      - name: Scrape the agency websites
        id: scrape
        if: steps.plan.outputs.scrape == 'true'
        continue-on-error: true
        timeout-minutes: 25
        run: python -m scraper.run

      - name: Check the result
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          d = json.loads(Path("data/listings.json").read_text())
          n = len(d["listings"])
          ok = [s["name"] for s in d["sources"] if s.get("ok")]
          stale = [s["name"] for s in d["sources"] if not s.get("ok") and s.get("count")]
          down = [s["name"] for s in d["sources"] if not s.get("ok") and not s.get("count")]
          print(f"{n} properties · read now: {', '.join(ok) or 'none'}")
          print(f"last good data used for: {', '.join(stale) or 'none'}")
          print(f"nothing available from: {', '.join(down) or 'none'}")
          if n < 100:
              sys.exit(f"Only {n} properties — refusing to publish this run.")
          PY

      - name: Commit the refreshed listings
        if: steps.plan.outputs.scrape == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/listings.json data/raw
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Listings refreshed $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build the site
        # DOMAIN also writes site/CNAME, which is what keeps the custom domain
        # attached across deploys. Clear it to fall back to the github.io address.
        run: |
          # The redesign. build_redesign.py writes its own CNAME from a domain
          # constant, so the custom domain ships with every deploy.
          python build_redesign.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-rd

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
